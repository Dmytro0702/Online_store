<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style/css/main.css" />
  <title>All Items</title>
</head>
<body>

  <header class="all-header">
    <div class="all-header__top">
      <span class="logo-text">foxmind<span class="highlighted">ed</span></span>
      <nav class="nav">
        <a href="shop.html" class="nav__btn">SHOP</a>
        <a href="main-page.html" class="nav__btn">MAINPAGE</a>
        <a href="history.html" class="nav__btn">OUR HISTORY</a>
        <a href="all-items.html" class="nav__btn active">ALL ITEMS</a>
        <button id="cartIconBtn" class="nav__cart-btn">
        <img src="../images/cart.svg" alt="cart icon" />
        </button>
      </nav>
    </div>
    <p class="breadcrumb">Home / All Items</p>
    <h1 class="page-title">All Items</h1>
  </header>

  <main class="all-main">
    <aside class="sidebar">
      <div class="search">
        <input id="search-input" type="text" placeholder="Search" class="search__input" />
        <button class="search__btn">
          <img src="../images/search.svg" alt="search icon" />
        </button>
      </div>

      <div class="filter-group">
        <h4>Topic</h4>
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Forest">Forest</button>
        <button class="filter-btn" data-category="Foxkid">Fox kids</button>
        <button class="filter-btn" data-category="Other">Other</button>
      </div>

      <div class="filter-group">
        <h4>Price</h4>
        <input id="filter-price" type="range" min="0" max="200" value="200" />
        <div id="filter-price-value" class="price-value">Value: £200</div>
      </div>
    </aside>

    <section id="product-list" class="product-grid">
     
    </section>
  </main>

  <div class="center">
    <button class="btn-all-foxes">All foxes</button>
  </div>

  <footer class="footer">
   
  </footer>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-panel" id="cartPanel">
    <button class="cart-panel__close" id="cartCloseBtn">×</button>
    <h2 class="cart-panel__title">Your Bag</h2>
    <div class="cart-panel__items" id="cart-items"></div>
    <div class="cart-panel__total">
      <strong>Total:</strong> <span id="cart-total">£0.00</span>
    </div>
    <button class="cart-panel__checkout">Checkout</button>
  </aside>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
